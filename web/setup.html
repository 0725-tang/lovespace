<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>创建你们的恋爱空间 · LoveSpace</title>
  <meta name="description" content="先写下你们的名字，再进入只属于你们的恋爱宇宙。">
  <meta name="theme-color" content="#070510">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23070510'/%3E%3Cpath d='M32 49c-2-2-17-11-17-22 0-6 4-10 9-10 4 0 7 2 8 5 1-3 4-5 8-5 5 0 9 4 9 10 0 11-15 20-17 22z' fill='%23ff8fa3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./setup.css">
</head>
<body class="setup-page">
  <div class="setup-stars" aria-hidden="true"></div>
  <div class="setup-orb setup-orb--rose" aria-hidden="true"></div>
  <div class="setup-orb setup-orb--violet" aria-hidden="true"></div>

  <main class="setup-shell">
    <section class="setup-intro">
      <a class="setup-brand" href="./setup" aria-label="LoveSpace">
        <span class="brand__mark">L</span>
        <span class="brand__word">LOVE<span>SPACE</span></span>
      </a>

      <p class="eyebrow setup-eyebrow">
        <span class="eyebrow__line" aria-hidden="true"></span>
        BEFORE THE FIRST STAR
      </p>
      <h1>先写下<br><em>你们的名字。</em></h1>
      <p class="setup-lede">这不是一个演示情侣的空间。填完这一页，它会变成只属于你们的宇宙。</p>

      <div class="setup-steps">
        <div class="setup-step">
          <span>01</span>
          <p>照片墙、回忆、情书和留言，初始都是空的。</p>
        </div>
        <div class="setup-step">
          <span>02</span>
          <p>名字、相爱日期和生日只保存在这台电脑上。</p>
        </div>
        <div class="setup-step">
          <span>03</span>
          <p>创建完成后，再次打开地址就会直接进入，不用重新填。</p>
        </div>
      </div>

      <p class="setup-privacy">✳ 初始化只允许在电脑本机完成；公网链接看不到这个页面。</p>
    </section>

    <section class="setup-card" aria-labelledby="setupTitle">
      <header class="setup-card__head">
        <p class="setup-kicker">CREATE YOUR LITTLE UNIVERSE</p>
        <h2 id="setupTitle">创建恋爱空间</h2>
        <p>这几项之后会出现在首页、倒计时和页脚里。</p>
      </header>

      <form class="setup-form" id="setupForm" novalidate>
        <div class="setup-grid">
          <label class="setup-field">
            <span>你的名字</span>
            <input id="setupMe" name="me" type="text" maxlength="24" autocomplete="name" placeholder="例如：林深" required>
          </label>
          <label class="setup-field">
            <span>恋人的名字</span>
            <input id="setupHer" name="her" type="text" maxlength="24" autocomplete="off" placeholder="例如：晚晚" required>
          </label>
        </div>

        <label class="setup-field">
          <span>你们相爱的日期</span>
          <input id="setupAnniversary" name="anniversary" type="date" required>
          <em>从这一天开始计算相爱天数</em>
        </label>

        <div class="setup-grid">
          <label class="setup-field">
            <span>你的生日</span>
            <input id="setupBirthdayMe" name="birthdayMe" type="date" required>
          </label>
          <label class="setup-field">
            <span>恋人的生日</span>
            <input id="setupBirthdayHer" name="birthdayHer" type="date" required>
          </label>
        </div>

        <div class="setup-actions">
          <button class="setup-submit" type="submit" id="setupSubmit">
            <span>创建恋爱空间</span>
            <span aria-hidden="true">→</span>
          </button>
          <p>创建后，照片墙、情书、留言和回忆都会从空白开始。</p>
        </div>
        <p class="setup-status" id="setupStatus" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script src="./setup.js"></script>
</body>
</html>
